<!doctype html><meta charset="utf-8"><title>Gemini 335 × FR5 实时监测</title>
<style>body{font:16px system-ui;background:#101823;color:#edf3ff;margin:20px}h1{font-size:24px}small{color:#b0bfd1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:#1b2939;padding:16px;border-radius:14px}.scene{grid-column:1/-1}.scene h2{display:inline-block;margin:0 12px 12px 0}img{display:block;width:100%;min-height:150px;object-fit:contain}#color{aspect-ratio:16/9;background:#070b10}#color:fullscreen{width:100vw;height:100vh;object-fit:contain}pre{white-space:pre-wrap;line-height:1.7}#warning{color:#ffd17c}a{color:#84cfff}button{background:#315a86;color:white;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}@media(max-width:800px){.grid{grid-template-columns:1fr}body{margin:12px}}</style>
<h1>Gemini 335 × FR5 实时监测</h1><p>本机采集相机画面与机械臂位姿 · 只读监测</p><p id="warning">标定验证进行中。相机与机器人数据独立采样；像素对齐不代表三维标定通过。</p>
<div class="grid"><section class="scene"><h2>彩色画面（与深度共用像素坐标）</h2><button type="button" onclick="document.getElementById('color').requestFullscreen()">全屏查看</button><div style="position:relative"><img id="color" alt="相机完整实时画面"></div><a href="/color.jpg" target="_blank">原始彩色图（用于内参标定）</a><pre id="camera">连接中…</pre></section><section><h2>FR5 实时状态</h2><pre id="robot">连接中…</pre><a href="http://192.168.58.2/" target="_blank" rel="noopener">打开法奥示教页面</a></section><section><h2>深度预览</h2><small>与上方校正后的彩色画面共用像素坐标；伪彩色范围 0–3000 mm，黑色表示无有效深度。</small><img id="depth" alt="对齐深度预览"></section></div>
<script>
const fmt=a=>a.map(x=>x.toFixed(3)).join(' / ');
async function tick(){try{const s=await(await fetch('/status')).json();for(const k of ['camera','robot']){const v=s[k];v.fresh=v.ok && Date.now()/1000-v.received_at<4;}camera.textContent=s.camera.fresh?`相机在线 · 彩色 ${s.camera.color_size.join('×')} · 深度 ${s.camera.depth_size.join('×')}\n有效深度 ${s.camera.depth_valid_percent}% · 中位深度 ${s.camera.depth_median_mm} mm`:`深度接口未就绪：${s.camera.error||'等待数据'}${s.camera.color_only?'；USB 视频接口已取得彩色画面':''}`;robot.textContent=s.robot.fresh?`机器人在线 · 192.168.58.2\n\n关节 J1–J6（°）\n${fmt(s.robot.joints_deg)}\n\nTCP X/Y/Z（mm）与 RX/RY/RZ（°）\n${fmt(s.robot.tcp_mm_deg)}\n\n本机接收时间：${new Date(s.robot.received_at*1000).toLocaleTimeString()}`:`机器人不可用：${s.robot.error||'等待数据'}`;for(const k of ['color','depth']){document.getElementById(k).style.opacity=(s.camera.fresh||(k==='color'&&s.camera.color_only&&Date.now()/1000-s.camera.received_at<5))?1:.2;if(s.camera.fresh||(k==='color'&&s.camera.color_only))document.getElementById(k).src=`/${k==='color'&&s.camera.fresh?'color_rectified':k}.jpg?t=${Date.now()}`;}}catch(e){robot.textContent='监测服务连接中断';camera.textContent='监测服务连接中断';for(const k of ['color','depth'])document.getElementById(k).style.opacity=.2;}setTimeout(tick,700)}tick();
</script>
